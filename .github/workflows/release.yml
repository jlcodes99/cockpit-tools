  build-macos-universal:
    name: "🏗️ Build: macOS Universal"
    # Reuse exact binaries from this run. Universal only merges and bundles.
    needs:
      - prepare-release
      - build-macos-aarch64
      - build-macos-x86_64
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm install

      - name: 🔄 Sync versions
        run: npm run sync-version

      - name: 📥 Download ARM binary inputs
        uses: actions/download-artifact@v4
        with:
          name: universal-inputs-aarch64
          path: universal-inputs/aarch64-apple-darwin

      - name: 📥 Download Intel binary inputs
        uses: actions/download-artifact@v4
        with:
          name: universal-inputs-x86_64
          path: universal-inputs/x86_64-apple-darwin

      - name: 🔗 Verify and merge Universal binaries
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/macos-universal.cjs --mode merge \
            --inputs universal-inputs --version "${VERSION}"

      - name: 📦 Bundle macOS Universal app
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/tauri.cjs bundle --ci --target universal-apple-darwin

      - name: 📝 Rebuild DMG with the Gatekeeper troubleshooting note
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/inject-dmg-readme.cjs \
            --bundle-dir "target/universal-apple-darwin/release/bundle"

      - name: 📦 Stage macOS Universal assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/stage_release_assets.cjs \
            --platform macos \
            --mac-arch universal \
            --assets-dir "target/universal-apple-darwin/release/bundle" \
            --output-dir "release-assets"

      - name: 📤 Upload macOS Universal assets
        if: needs.prepare-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          shopt -s nullglob
          ASSETS=(release-assets/*)
          test "${#ASSETS[@]}" -gt 0
          node scripts/release/upload_release_assets.cjs "${TAG}" "${ASSETS[@]}"
          echo "Uploaded ${#ASSETS[@]} macOS Universal assets"

      - name: 📦 Upload macOS Universal validation artifacts
        if: needs.prepare-release.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-universal
          retention-days: 7
          if-no-files-found: error
          path: |
            release-assets

      - name: 🧾 Publish macOS Universal package summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          {
            echo "### 🍎 macOS Universal packages"
            echo
            echo "**Mode:** ${{ needs.prepare-release.outputs.publish == 'true' && 'GitHub Release' || 'Validation artifact' }}"
            echo
            if [ "${#assets[@]}" -gt 0 ]; then
              for asset in "${assets[@]}"; do
                printf -- '- `%s`\n' "$(basename "$asset")"
              done
            else
              echo "❌ No staged release packages were produced."
            fi
            if [ "$JOB_STATUS" != "success" ]; then
              echo
              echo "❌ The macOS Universal release job did not complete successfully."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-linux:
    name: "🏗️ Build: Linux (${{ matrix.label }})"
    # Parallel with Windows / macOS after prepare; matrix arches run in parallel.
    needs:
      - prepare-release
      - prepare-frontend
      - prepare-sidecars
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "x86_64"
            platform: "ubuntu-22.04"
            targets: "linux-x86_64-appimage,linux-x86_64-deb,linux-x86_64-rpm"
          - label: "aarch64"
            platform: "ubuntu-24.04-arm"
            targets: "linux-aarch64-appimage,linux-aarch64-deb,linux-aarch64-rpm"
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev
          sudo apt-get install -y libnm-dev xdg-utils

      - name: 🦀 Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Host build cache
        uses: ./.github/actions/host-build-cache
        with:
          target: linux-${{ matrix.label }}

      - name: 🐹 Go setup
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm install

      - name: 🔄 Sync versions
        run: npm run sync-version

      - name: 📥 Reuse production frontend
        uses: actions/download-artifact@v4
        with:
          name: build-inputs-release-frontend
          path: dist

      - name: 📥 Reuse production sidecars
        uses: actions/download-artifact@v4
        with:
          name: build-inputs-release-sidecars
          path: sidecars/cockpit-cliproxy/bin

      - name: 🔐 Restore sidecar executable permissions
        run: chmod +x sidecars/cockpit-cliproxy/bin/*

      - name: 🏗️ Build Linux app
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          COCKPIT_SKIP_CLIPROXY_BUILD: "1"
          COCKPIT_PREBUILT_FRONTEND_DIST: "dist"
        run: |
          set -euo pipefail
          npx tauri build --ci

      - name: 📥 Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release-metadata

      - name: 📦 Stage Linux assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/stage_release_assets.cjs \
            --platform linux \
            --assets-dir "target/release/bundle" \
            --output-dir "release-assets"

      - name: 📤 Upload Linux assets
        if: needs.prepare-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          shopt -s nullglob
          ASSETS=(release-assets/*)
          test "${#ASSETS[@]}" -gt 0
          node scripts/release/upload_release_assets.cjs "${TAG}" "${ASSETS[@]}"
          echo "Uploaded ${#ASSETS[@]} Linux assets"

      - name: 📤 Build and upload Linux updater manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PUBLISH: ${{ needs.prepare-release.outputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/build_target_latest_json.cjs \
            --version "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --assets-dir "release-assets" \
            --notes-file "release-metadata/release-notes.md" \
            --published-at "$(cat release-metadata/published-at.txt)" \
            --targets "${{ matrix.targets }}" \
            --output-dir "target-manifests"
          if [ "${RELEASE_PUBLISH}" = "true" ]; then
            node scripts/release/upload_release_assets.cjs "v${VERSION}" target-manifests/*.json
          fi

      - name: 📦 Upload Linux validation artifacts
        if: needs.prepare-release.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.label }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release-assets
            target-manifests

      - name: 🧾 Publish Linux package summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          {
            echo "### 🐧 Linux ${{ matrix.label }} packages"
            echo
            echo "**Mode:** ${{ needs.prepare-release.outputs.publish == 'true' && 'GitHub Release' || 'Validation artifact' }}"
            echo
            if [ "${#assets[@]}" -gt 0 ]; then
              for asset in "${assets[@]}"; do
                printf -- '- `%s`\n' "$(basename "$asset")"
              done
            else
              echo "❌ No staged release packages were produced."
            fi
            if [ "$JOB_STATUS" != "success" ]; then
              echo
              echo "❌ The Linux release job did not complete successfully."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  finalize-legacy-latest:
    name: 🏁 Finalize Legacy Updater Manifest
    if: needs.prepare-release.outputs.publish == 'true'
    # Wait for every platform build so latest.json is complete.
    needs:
      - prepare-release
      - build-windows
      - build-macos-aarch64
      - build-macos-x86_64
      - build-macos-universal
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📥 Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release-metadata

      - name: 📥 Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          TAG="v${VERSION}"
          downloaded="false"
          for i in $(seq 1 30); do
            if gh release download "${TAG}" --dir release-assets --pattern "*" --clobber; then
              downloaded="true"
              break
            fi
            echo "Release assets not ready yet (attempt $i/30). Sleeping 10s..."
            sleep 10
          done
          if [ "${downloaded}" != "true" ]; then
            echo "Failed to download release assets from ${TAG} after retries."
            exit 1
          fi

      - name: 🏗️ Build complete legacy latest.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/build_merged_latest_json.cjs \
            --version "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --assets-dir "release-assets" \
            --notes-file "release-metadata/release-notes.md" \
            --published-at "$(cat release-metadata/published-at.txt)" \
            --output "latest.json"

      - name: 🔍 Validate complete legacy latest.json
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .platforms["darwin-aarch64"] and
            .platforms["darwin-x86_64"] and
            .platforms["windows-x86_64"] and
            .platforms["windows-x86_64-nsis"] and
            .platforms["linux-x86_64-appimage"] and
            .platforms["linux-x86_64-deb"] and
            .platforms["linux-x86_64-rpm"] and
            .platforms["linux-aarch64-appimage"] and
            .platforms["linux-aarch64-deb"] and
            .platforms["linux-aarch64-rpm"]
          ' latest.json > /dev/null
          jq -r '.platforms | keys[]' latest.json

      - name: 📤 Upload complete legacy latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/upload_release_assets.cjs "v${VERSION}" latest.json

  upload-checksums:
    name: 🔗 Publish SHA256SUMS
    if: needs.prepare-release.outputs.publish == 'true'
    needs:
      - prepare-release
      - finalize-legacy-latest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📥 Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "v${VERSION}" --dir release-assets --pattern "*" --clobber

      - name: ⚙️ Generate SHA256SUMS.txt from release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          rm -f SHA256SUMS.txt
          find . -type f -print0 \
            | sort -z \
            | while IFS= read -r -d '' file; do
                shasum -a 256 "$file"
              done \
            | sed 's#  \./#  #' \
            > ../SHA256SUMS.txt
          cd ..
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 📤 Upload SHA256SUMS.txt to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/upload_release_assets.cjs "v${VERSION}" SHA256SUMS.txt

  publish-release:
    name: 🚀 Publish Verified Release
    if: needs.prepare-release.outputs.publish == 'true'
    needs:
      - prepare-release
      - finalize-legacy-latest
      - upload-checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🚀 Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          IS_DRAFT="$(gh release view "${TAG}" --json isDraft --jq '.isDraft')"
          if [ "${IS_DRAFT}" = "true" ]; then
            gh release edit "${TAG}" --draft=false --prerelease=false --latest
          elif [ "${IS_DRAFT}" = "false" ]; then
            # Re-running this job after public verification failed must reach
            # verification again without changing the already public release.
            echo "Release ${TAG} is already public; continuing to verification."
          else
            echo "Unexpected draft state for release ${TAG}: ${IS_DRAFT}"
            exit 1
          fi

      - name: 🔍 Verify complete published updater state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/verify_published_updater_manifests.cjs \
            --version "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --targets "darwin-aarch64-app,darwin-x86_64-app,windows-x86_64-msi,windows-x86_64-nsis,linux-x86_64-appimage,linux-x86_64-deb,linux-x86_64-rpm,linux-aarch64-appimage,linux-aarch64-deb,linux-aarch64-rpm" \
            --legacy

  update-homebrew-cask:
    name: 🍺 Update Homebrew Cask
    if: needs.prepare-release.outputs.publish == 'true'
    needs:
      - prepare-release
      - publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: 📥 Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 📥 Download universal DMG from GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Cockpit.Tools_${VERSION}_universal.dmg"
          echo "Downloading: ${URL}"
          for i in $(seq 1 30); do
            if curl -fL --retry 3 --retry-delay 1 -o cockpit-tools.dmg "${URL}"; then
              exit 0
            fi
            echo "Asset not ready yet (attempt $i/30). Sleeping 10s..."
            sleep 10
          done
          echo "Failed to download release asset after retries."
          exit 1

      - name: ⚙️ Compute SHA-256
        shell: bash
        run: |
          set -euo pipefail
          SHA256="$(sha256sum cockpit-tools.dmg | awk '{print $1}')"
          echo "SHA256=${SHA256}" >> "$GITHUB_ENV"

      - name: 📝 Update Cask file
        shell: bash
        run: |
          set -euo pipefail
          FILE="Casks/cockpit-tools.rb"
          if [ ! -f "${FILE}" ]; then
            echo "Missing ${FILE}. Create it first."
            exit 1
          fi

          perl -0777 -i -pe \
            's/version \"[^\"]+\"/version \"'"${VERSION}"'\"/; s/sha256 \"[0-9a-f]{64}\"/sha256 \"'"${SHA256}"'\"/' \
            "${FILE}"

          git diff -- "${FILE}"

      - name: 🚀 Create pull request
        id: create_cask_pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(homebrew): update cask for v${{ env.VERSION }}"
          title: "chore(homebrew): update cask for v${{ env.VERSION }}"
          body: |
            Auto-generated by the release workflow.

            - version: ${{ env.VERSION }}
            - sha256 (universal.dmg): ${{ env.SHA256 }}
          branch: "automation/update-cask-v${{ env.VERSION }}"
          base: main
          delete-branch: true

      - name: 🚀 Enable auto-merge for cask PR
        if: ${{ steps.create_cask_pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.create_cask_pr.outputs.pull-request-number }}"
          PR_BRANCH="$(gh pr view "${PR_NUMBER}" --json headRefName --jq '.headRefName')"
          if [[ "${PR_BRANCH}" != automation/update-cask-v* ]]; then
            echo "Unexpected PR branch: ${PR_BRANCH}"
            exit 1
          fi
          if gh pr merge "${PR_NUMBER}" --auto --squash --delete-branch; then
            exit 0
          fi

          PR_STATE="$(gh pr view "${PR_NUMBER}" --json state --jq '.state')"
          PR_MERGE_STATE="$(gh pr view "${PR_NUMBER}" --json mergeStateStatus --jq '.mergeStateStatus')"
          if [ "${PR_STATE}" = "MERGED" ]; then
            echo "Cask PR ${PR_NUMBER} was merged while enabling auto-merge"
            exit 0
          fi
          if [ "${PR_STATE}" = "OPEN" ] && [ "${PR_MERGE_STATE}" = "CLEAN" ]; then
            echo "Cask PR ${PR_NUMBER} is ready; merging directly"
            gh pr merge "${PR_NUMBER}" --squash --delete-branch
            exit 0
          fi

          echo "Unable to enable auto-merge for cask PR ${PR_NUMBER}: state=${PR_STATE}, merge_state=${PR_MERGE_STATE}"
          exit 1

  validate-release-artifacts:
    name: "🧪 Validate packaged release"
    if: needs.prepare-release.outputs.publish != 'true'
    needs:
      - prepare-release
      - build-windows
      - build-macos-aarch64
      - build-macos-x86_64
      - build-macos-universal
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📥 Download packaged release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: validation-workspace
          merge-multiple: true

      - name: 🏗️ Build and validate complete updater manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/build_merged_latest_json.cjs \
            --version "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --assets-dir "validation-workspace/release-assets" \
            --notes-file "validation-workspace/release-notes.md" \
            --published-at "$(cat validation-workspace/published-at.txt)" \
            --output "latest.json"

          jq -e '
            .platforms["darwin-aarch64"] and
            .platforms["darwin-x86_64"] and
            .platforms["windows-x86_64"] and
            .platforms["windows-x86_64-nsis"] and
            .platforms["linux-x86_64-appimage"] and
            .platforms["linux-x86_64-deb"] and
            .platforms["linux-x86_64-rpm"] and
            .platforms["linux-aarch64-appimage"] and
            .platforms["linux-aarch64-deb"] and
            .platforms["linux-aarch64-rpm"]
          ' latest.json > /dev/null

          test -n "$(find validation-workspace/release-assets -name '*_universal.dmg' -print -quit)"

      - name: 🔗 Generate validation checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd validation-workspace/release-assets
            find . -type f -print0 \
              | sort -z \
              | while IFS= read -r -d '' file; do
                  shasum -a 256 "$file"
                done \
              | sed 's#  \./#  #'
          ) > SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: 📤 Upload complete release validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ env.VERSION }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            validation-workspace/release-assets
            validation-workspace/target-manifests
            latest.json
            SHA256SUMS.txt

      - name: 🧾 Publish release validation summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          asset_count="$(find validation-workspace/release-assets -type f 2>/dev/null | wc -l | tr -d ' ')"
          manifest_count="$(find validation-workspace/target-manifests -type f -name '*.json' 2>/dev/null | wc -l | tr -d ' ')"
          checksum_count="$(wc -l < SHA256SUMS.txt 2>/dev/null || printf '0')"
          platform_count="$(jq '.platforms | length' latest.json 2>/dev/null || printf '0')"
          {
            echo "### 🧪 Complete release validation"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Packaged assets | ${asset_count} |"
            echo "| Target updater manifests | ${manifest_count} |"
            echo "| Legacy updater platforms | ${platform_count} |"
            echo "| SHA-256 entries | ${checksum_count} |"
            if [ "$JOB_STATUS" = "success" ]; then
              echo "| Validation bundle | ✅ Uploaded |"
            else
              echo "| Validation bundle | ❌ Incomplete |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
