name: 📦 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Releases (false creates validation artifacts only)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.publish != true }}

jobs:
  prepare-release:
    name: 📝 Prepare Staged Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.app_version.outputs.VERSION }}
      publish: ${{ steps.publish_mode.outputs.PUBLISH }}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 🧭 Determine publication mode
        id: publish_mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.publish }}" = "true" ]; then
              echo "PUBLISH=true" >> "$GITHUB_OUTPUT"
            else
              echo "PUBLISH=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "PUBLISH=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔍 Validate release ref
        if: ${{ steps.publish_mode.outputs.PUBLISH == 'true' && !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          echo "Release runs must target a v* tag; received ${GITHUB_REF}."
          exit 1

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📖 Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -e "console.log(require(require('path').join(process.env.GITHUB_WORKSPACE, 'package.json')).version)")"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 🔍 Validate tag matches version
        if: steps.publish_mode.outputs.PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_TAG="v${{ steps.app_version.outputs.VERSION }}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag (${GITHUB_REF_NAME}) does not match package.json version (${EXPECTED_TAG})."
            exit 1
          fi

      - name: 📝 Build bilingual release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.app_version.outputs.VERSION }}"

          extract_section() {
            local file="$1"
            local version="$2"

            awk -v version="$version" '
              BEGIN {
                capture = 0
                found = 0
              }

              /^## / {
                if (capture) {
                  exit
                }
                if ($0 ~ ("^## \\[" version "\\][[:space:]]*-.*$") || $0 ~ ("^## \\[v" version "\\][[:space:]]*-.*$")) {
                  capture = 1
                  found = 1
                }
              }

              capture {
                if ($0 ~ /^---[[:space:]]*$/) {
                  exit
                }
                print
              }

              END {
                if (!found) {
                  exit 2
                }
              }
            ' "$file"
          }

          if ! zh_section="$(extract_section CHANGELOG.zh-CN.md "$VERSION")"; then
            echo "Missing changelog section for version $VERSION in CHANGELOG.zh-CN.md"
            exit 1
          fi

          if ! en_section="$(extract_section CHANGELOG.md "$VERSION")"; then
            echo "Missing changelog section for version $VERSION in CHANGELOG.md"
            exit 1
          fi

          {
            echo "## 更新日志（中文）"
            echo
            printf '%s\n' "$zh_section"
            echo
            echo "## Changelog (English)"
            echo
            printf '%s\n' "$en_section"
          } > release-notes.md

          date -u +"%Y-%m-%dT%H:%M:%SZ" > published-at.txt

      - name: 🚀 Create or update draft release
        if: steps.publish_mode.outputs.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.app_version.outputs.VERSION }}"
          TITLE="Cockpit Tools v${{ steps.app_version.outputs.VERSION }}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            IS_DRAFT="$(gh release view "${TAG}" --json isDraft --jq '.isDraft')"
            if [ "${IS_DRAFT}" != "true" ]; then
              echo "Release ${TAG} is already published; refusing to mutate a public release."
              exit 1
            fi
            gh release edit "${TAG}" --title "${TITLE}" --notes-file release-notes.md
          else
            gh release create "${TAG}" --draft --title "${TITLE}" --notes-file release-notes.md
          fi

      - name: 📤 Upload release metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          retention-days: 7
          if-no-files-found: error
          path: |
            release-notes.md
            published-at.txt

  prepare-frontend:
    name: "🌐 Prepare production frontend"
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🔄 Sync release versions
        run: npm run sync-version

      - name: 🏗️ Build production frontend assets
        run: npm run build

      - name: 📤 Share production frontend
        uses: actions/upload-artifact@v4
        with:
          name: build-inputs-release-frontend
          path: dist
          retention-days: 1
          compression-level: 0

  prepare-sidecars:
    name: "🐹 Prepare production sidecars"
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐹 Go setup
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: 🏗️ Build production sidecars
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build_sidecars.sh

      - name: 📤 Share production sidecars
        uses: actions/upload-artifact@v4
        with:
          name: build-inputs-release-sidecars
          path: sidecars/cockpit-cliproxy/bin
          retention-days: 1
          compression-level: 0

  build-windows:
    name: "🏗️ Build: Windows"
    needs:
      - prepare-release
      - prepare-frontend
      - prepare-sidecars
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Host build cache
        uses: ./.github/actions/host-build-cache
        with:
          target: windows

      - name: 🐹 Go setup
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm install

      - name: 🔄 Sync versions
        run: npm run sync-version

      - name: 📥 Reuse production frontend
        uses: actions/download-artifact@v4
        with:
          name: build-inputs-release-frontend
          path: dist

      - name: 📥 Reuse production sidecars
        uses: actions/download-artifact@v4
        with:
          name: build-inputs-release-sidecars
          path: sidecars/cockpit-cliproxy/bin

      - name: 🏗️ Build Windows app
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          COCKPIT_SKIP_CLIPROXY_BUILD: "1"
          COCKPIT_PREBUILT_FRONTEND_DIST: "dist"
        run: |
          set -euo pipefail
          npx tauri build --ci

      - name: 📦 Build Windows portable archive
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/build_windows_portable.cjs \
            --version "${VERSION}" \
            --release-dir "target/release" \
            --output-dir "portable-assets"

      - name: 📥 Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release-metadata

      - name: 📦 Stage Windows release assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/stage_release_assets.cjs \
            --platform windows \
            --assets-dir "target/release/bundle" \
            --output-dir "release-assets"
          cp portable-assets/* release-assets/

      - name: 📤 Upload Windows release assets
        if: needs.prepare-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          shopt -s nullglob
          ASSETS=(release-assets/*)
          test "${#ASSETS[@]}" -gt 0
          node scripts/release/upload_release_assets.cjs "${TAG}" "${ASSETS[@]}"
          echo "Uploaded ${#ASSETS[@]} Windows assets"

      - name: 📤 Build and upload Windows updater manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PUBLISH: ${{ needs.prepare-release.outputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/build_target_latest_json.cjs \
            --version "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --assets-dir "release-assets" \
            --notes-file "release-metadata/release-notes.md" \
            --published-at "$(cat release-metadata/published-at.txt)" \
            --targets "windows-x86_64-msi,windows-x86_64-nsis" \
            --output-dir "target-manifests"
          if [ "${RELEASE_PUBLISH}" = "true" ]; then
            node scripts/release/upload_release_assets.cjs "v${VERSION}" target-manifests/*.json
          fi

      - name: 📦 Upload Windows validation artifacts
        if: needs.prepare-release.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          retention-days: 7
          if-no-files-found: error
          path: |
            release-assets
            target-manifests

      - name: 🧾 Publish Windows package summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          {
            echo "### 🪟 Windows packages"
            echo
            echo "**Mode:** ${{ needs.prepare-release.outputs.publish == 'true' && 'GitHub Release' || 'Validation artifact' }}"
            echo
            if [ "${#assets[@]}" -gt 0 ]; then
              for asset in "${assets[@]}"; do
                printf -- '- `%s`\n' "$(basename "$asset")"
              done
            else
              echo "❌ No staged release packages were produced."
            fi
            if [ "$JOB_STATUS" != "success" ]; then
              echo
              echo "❌ The Windows release job did not complete successfully."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-macos-aarch64:
    name: "🏗️ Build: macOS Apple Silicon"
    # Parallel with Windows / macOS Intel after prepare (no hard platform deps).
    needs:
      - prepare-release
      - prepare-frontend
      - prepare-sidecars
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: 💾 Host build cache
        uses: ./.github/actions/host-build-cache
        with:
          target: macos-aarch64

      - name: 🐹 Go setup
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm install

      - name: 🔄 Sync versions
        run: npm run sync-version

      - name: 📥 Reuse production frontend
        uses: actions/download-artifact@v4
        with:
          name: build-inputs-release-frontend
          path: dist

      - name: 📥 Reuse production sidecars
        uses: actions/download-artifact@v4
        with:
          name: build-inputs-release-sidecars
          path: sidecars/cockpit-cliproxy/bin

      - name: 🔐 Restore sidecar executable permissions
        run: chmod +x sidecars/cockpit-cliproxy/bin/*

      - name: 🏗️ Build macOS Apple Silicon app
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          COCKPIT_SKIP_CLIPROXY_BUILD: "1"
          COCKPIT_PREBUILT_FRONTEND_DIST: "dist"
        run: |
          set -euo pipefail
          node scripts/tauri.cjs build --ci --target aarch64-apple-darwin

      - name: 📦 Prepare Universal binary inputs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/macos-universal.cjs --mode stage \
            --target aarch64-apple-darwin --version "${VERSION}" \
            --output "universal-inputs/aarch64-apple-darwin"

      - name: 📤 Share Universal binary inputs
        uses: actions/upload-artifact@v4
        with:
          name: universal-inputs-aarch64
          path: universal-inputs/aarch64-apple-darwin
          overwrite: true
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

      - name: 📝 Rebuild DMG with the Gatekeeper troubleshooting note
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/inject-dmg-readme.cjs \
            --bundle-dir "target/aarch64-apple-darwin/release/bundle"

      - name: 📥 Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release-metadata

      - name: 📦 Stage macOS Apple Silicon assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/stage_release_assets.cjs \
            --platform macos \
            --mac-arch aarch64 \
            --assets-dir "target/aarch64-apple-darwin/release/bundle" \
            --output-dir "release-assets"

      - name: 📤 Upload macOS Apple Silicon assets
        if: needs.prepare-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          shopt -s nullglob
          ASSETS=(release-assets/*)
          test "${#ASSETS[@]}" -gt 0
          node scripts/release/upload_release_assets.cjs "${TAG}" "${ASSETS[@]}"
          echo "Uploaded ${#ASSETS[@]} macOS Apple Silicon assets"

      - name: 📤 Build and upload macOS Apple Silicon updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PUBLISH: ${{ needs.prepare-release.outputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/build_target_latest_json.cjs \
            --version "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --assets-dir "release-assets" \
            --notes-file "release-metadata/release-notes.md" \
            --published-at "$(cat release-metadata/published-at.txt)" \
            --targets "darwin-aarch64-app" \
            --output-dir "target-manifests"
          if [ "${RELEASE_PUBLISH}" = "true" ]; then
            node scripts/release/upload_release_assets.cjs "v${VERSION}" target-manifests/*.json
          fi

      - name: 📦 Upload macOS Apple Silicon validation artifacts
        if: needs.prepare-release.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-aarch64
          retention-days: 7
          if-no-files-found: error
          path: |
            release-assets
            target-manifests

      - name: 🧾 Publish macOS Apple Silicon package summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          {
            echo "### 🍎 macOS Apple Silicon packages"
            echo
            echo "**Mode:** ${{ needs.prepare-release.outputs.publish == 'true' && 'GitHub Release' || 'Validation artifact' }}"
            echo
            if [ "${#assets[@]}" -gt 0 ]; then
              for asset in "${assets[@]}"; do
                printf -- '- `%s`\n' "$(basename "$asset")"
              done
            else
              echo "❌ No staged release packages were produced."
            fi
            if [ "$JOB_STATUS" != "success" ]; then
              echo
              echo "❌ The macOS Apple Silicon release job did not complete successfully."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-macos-x86_64:
    name: "🏗️ Build: macOS Intel"
    # Parallel with Windows / macOS Apple Silicon after prepare.
    needs:
      - prepare-release
      - prepare-frontend
      - prepare-sidecars
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: 💾 Host build cache
        uses: ./.github/actions/host-build-cache
        with:
          target: macos-x86_64

      - name: 🐹 Go setup
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
