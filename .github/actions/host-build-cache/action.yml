name: Host build cache
description: Share dependency caches between trusted main builds and tagged releases.
inputs:
  target:
    description: Stable platform and target identifier, shared by CI and release jobs.
    required: true
runs:
  using: composite
  steps:
    - name: Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: host-release-v2-${{ inputs.target }}
        workspaces: ". -> target"
        cache-workspace-crates: "false"
        save-if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

    # macOS embeds create-dmg under target/.../bundle/share; it does not
    # populate ~/Library/Caches/tauri. Only Windows/Linux download tools here.
    - name: Tauri bundler tools
      if: runner.os != 'macOS'
      uses: actions/cache@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/tauri' || '~/.cache/tauri' }}
        key: tauri-tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'package-lock.json') }}
        restore-keys: |
          tauri-tools-v2-${{ runner.os }}-${{ runner.arch }}-
