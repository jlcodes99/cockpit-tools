[package]
name = "cockpit-cli"
version = "0.1.0"
edition = "2021"
authors = ["jlcodes"]
license = "CC-BY-NC-SA-4.0"

# `cockpit quota --json` is the public command. Keep `cockpit-cli` as a
# compatibility alias for older consumers.
[[bin]]
name = "cockpit"
path = "src/main.rs"

[[bin]]
name = "cockpit-cli"
path = "src/main.rs"

[dependencies]
cockpit-core = { path = "../cockpit-core" }
clap = { version = "4.5", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
chrono.workspace = true
colored = "2.1"
tabled = "0.15"
